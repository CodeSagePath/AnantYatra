[model]
id = "Qwen/Qwen2.5-1.5B-Instruct"
revision = "989aa7980e4cf806f80c7fef2b1adb7bc71aa306"
max_sequence_length = 512

[data]
train_file = "ai/data/train.jsonl"
policy_file = "ai/configs/data-policy.toml"
source_register_file = "ai/data/source-register.jsonl"
consent_register_file = "ai/data/private/consent-records.jsonl"

[output]
directory = "ai/runs/karnataka-qlora"

[training]
epochs = 1
batch_size = 1
gradient_accumulation_steps = 8
learning_rate = 0.0001
warmup_ratio = 0.03
weight_decay = 0.01
logging_steps = 1
save_total_limit = 2
max_grad_norm = 0.3
gradient_checkpointing = true
seed = 42

[lora]
rank = 4
alpha = 8
dropout = 0.05
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj"]
